blueprint:
  name: IKEA SOMRIG dimmer for light
  description: Toggle a light with a short press on button 1, hold button 1 to brighten, and hold button 2 to dim. The dimming step and minimum brightness are configurable.
  domain: automation
  input:
    dimmer_device:
      name: IKEA SOMRIG
      description: Select the SOMRIG shortcut button paired through ZHA.
      selector:
        device:
          integration: zha
    light_entity:
      name: Light
      description: Select the light entity to control.
      selector:
        entity:
          domain: light
    brightness_step:
      name: Brightness step
      description: Percentage to change brightness on each repeat. Increase this value for faster dimming.
      default: 5
      selector:
        number:
          min: 1
          max: 25
          step: 1
          unit_of_measurement: "%"
          mode: slider
    minimum_brightness:
      name: Minimum brightness
      description: Dim-down stops at this brightness and will not turn the light off.
      default: 5
      selector:
        number:
          min: 1
          max: 50
          step: 1
          unit_of_measurement: "%"
          mode: slider

variables:
  selected_light: !input light_entity
  brightness_step: !input brightness_step
  minimum_brightness: !input minimum_brightness

triggers:
  - device_id: !input dimmer_device
    domain: zha
    type: remote_button_short_press
    subtype: button_1
    trigger: device
    id: toggle
  - device_id: !input dimmer_device
    domain: zha
    type: remote_button_long_press
    subtype: button_1
    trigger: device
    id: brightness_increase
  - device_id: !input dimmer_device
    domain: zha
    type: remote_button_long_press
    subtype: button_2
    trigger: device
    id: brightness_decrease
  - device_id: !input dimmer_device
    domain: zha
    type: remote_button_long_release
    subtype: button_1
    trigger: device
    id: brightness_increase_release
  - device_id: !input dimmer_device
    domain: zha
    type: remote_button_long_release
    subtype: button_2
    trigger: device
    id: brightness_decrease_release

conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: toggle
        sequence:
          - action: light.toggle
            target:
              entity_id: !input light_entity
      - conditions:
          - condition: trigger
            id: brightness_increase
        sequence:
          - repeat:
              while:
                - condition: template
                  value_template: >-
                    {{ not is_state(selected_light, 'on') or
                       ((state_attr(selected_light, 'brightness') | int(0)) * 100 / 255) < 100 }}
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: !input light_entity
                  data:
                    brightness_pct: >-
                      {{ [100, (((state_attr(selected_light, 'brightness') | int(0)) * 100 / 255) | round(0)) + (brightness_step | int)] | min }}
                    transition: 0.2
                - delay: "00:00:00.2"
      - conditions:
          - condition: trigger
            id: brightness_decrease
        sequence:
          - repeat:
              while:
                - condition: template
                  value_template: >-
                    {{ is_state(selected_light, 'on') and
                       (((state_attr(selected_light, 'brightness') | int(0)) * 100 / 255) | round(0)) > (minimum_brightness | int) }}
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: !input light_entity
                  data:
                    brightness_pct: >-
                      {{ [minimum_brightness | int, (((state_attr(selected_light, 'brightness') | int(0)) * 100 / 255) | round(0)) - (brightness_step | int)] | max }}
                    transition: 0.2
                - delay: "00:00:00.2"

mode: restart
