blueprint:
  name: ZHA dimmer for light
  description: Toggle a light with a short press and adjust its brightness while holding dim up or dim down.
  domain: automation
  input:
    dimmer_device:
      name: ZHA dimmer
      description: Select the ZHA remote that sends the button events.
      selector:
        device:
          integration: zha
    light_device:
      name: Light device
      description: Select the device that provides the light entity.
      selector:
        device:
          integration: zha

triggers:
  - device_id: !input dimmer_device
    domain: zha
    type: remote_button_short_press
    subtype: turn_on
    trigger: device
    id: toggle
  - device_id: !input dimmer_device
    domain: zha
    type: remote_button_long_press
    subtype: dim_up
    trigger: device
    id: brightness_increase
  - device_id: !input dimmer_device
    domain: zha
    type: remote_button_long_press
    subtype: dim_down
    trigger: device
    id: brightness_decrease
  - device_id: !input dimmer_device
    domain: zha
    type: remote_button_long_release
    subtype: dim_up
    trigger: device
    id: brightness_increase_release
  - device_id: !input dimmer_device
    domain: zha
    type: remote_button_long_release
    subtype: dim_down
    trigger: device
    id: brightness_decrease_release

conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: toggle
        sequence:
          - action: light.toggle
            target:
              device_id: !input light_device
      - conditions:
          - condition: trigger
            id: brightness_increase
        sequence:
          - repeat:
              while:
                - condition: template
                  value_template: "{{ true }}"
              sequence:
                - action: light.turn_on
                  target:
                    device_id: !input light_device
                  data:
                    brightness_step_pct: 2
                    transition: 0.2
                - delay: "00:00:00.2"
      - conditions:
          - condition: trigger
            id: brightness_decrease
        sequence:
          - repeat:
              while:
                - condition: template
                  value_template: "{{ true }}"
              sequence:
                - action: light.turn_on
                  target:
                    device_id: !input light_device
                  data:
                    brightness_step_pct: -2
                    transition: 0.2
                - delay: "00:00:00.2"

mode: restart
