# Replace these example entity IDs with the ones from your Home Assistant.
alias: Toggle light when dimmer is used
description: Toggles the light and adjusts brightness with ZHA dimmer long presses.
triggers:
  - trigger: state
    entity_id: binary_sensor.YOUR_DIMMER
    to: "on"
    id: toggle
  - device_id: 1bdec6f7bee8f8d00400c8d3f09da514
    domain: zha
    type: remote_button_long_press
    subtype: dim_up
    trigger: device
    id: brightness_increase
  - device_id: 1bdec6f7bee8f8d00400c8d3f09da514
    domain: zha
    type: remote_button_long_press
    subtype: dim_down
    trigger: device
    id: brightness_decrease
  - device_id: 1bdec6f7bee8f8d00400c8d3f09da514
    domain: zha
    type: remote_button_long_release
    subtype: dim_up
    trigger: device
    id: brightness_increase_release
  - device_id: 1bdec6f7bee8f8d00400c8d3f09da514
    domain: zha
    type: remote_button_long_release
    subtype: dim_down
    trigger: device
    id: brightness_decrease_release

conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: toggle
        sequence:
          - action: light.toggle
            target:
              entity_id: light.YOUR_LIGHT
      - conditions:
          - condition: trigger
            id: brightness_increase
        sequence:
          - repeat:
              while:
                - condition: template
                  value_template: "{{ true }}"
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: light.YOUR_LIGHT
                  data:
                    brightness_step_pct: 2
                    transition: 0.2
                - delay: "00:00:00.2"
      - conditions:
          - condition: trigger
            id: brightness_decrease
        sequence:
          - repeat:
              while:
                - condition: template
                  value_template: "{{ true }}"
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: light.YOUR_LIGHT
                  data:
                    brightness_step_pct: -2
                    transition: 0.2
                - delay: "00:00:00.2"

mode: restart